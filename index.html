<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Смета за 5 минут</h1>
      <p class="hint">Заполните реквизиты и позиции — сумма считается сама.</p>
    </header>

    <section class="card" aria-labelledby="details-title">
      <h2 id="details-title">Реквизиты</h2>
      <div class="details">
        <div class="field">
          <label for="from">От кого</label>
          <input id="from" type="text" autocomplete="organization">
        </div>
        <div class="field">
          <label for="to">Для кого</label>
          <input id="to" type="text">
        </div>
        <div class="field">
          <label for="number">Номер сметы</label>
          <input id="number" type="text">
        </div>
        <div class="field">
          <label for="date">Дата</label>
          <input id="date" type="date">
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="items-title">
      <h2 id="items-title">Позиции</h2>
      <table class="items">
        <thead>
          <tr>
            <th scope="col">Наименование</th>
            <th scope="col">Количество</th>
            <th scope="col">Единица</th>
            <th scope="col">Цена, <span class="cur">₸</span></th>
            <th scope="col">Сумма</th>
            <th scope="col"><span class="visually-hidden">Удалить</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <button type="button" id="add" class="btn btn-secondary">+ Добавить позицию</button>
    </section>

    <section class="card" aria-labelledby="calc-title">
      <h2 id="calc-title">Скидка, НДС и валюта</h2>
      <div class="calc">
        <div class="field">
          <label for="discount">Скидка, %</label>
          <input id="discount" type="text" inputmode="decimal" value="0">
        </div>
        <div class="field">
          <label for="vat">НДС, %</label>
          <input id="vat" type="text" inputmode="decimal" value="0">
        </div>
        <div class="field">
          <label for="currency">Валюта</label>
          <select id="currency">
            <option value="₸">₸ (тенге)</option>
            <option value="₽">₽ (рубль)</option>
            <option value="$">$ (доллар)</option>
            <option value="€">€ (евро)</option>
          </select>
        </div>
      </div>
    </section>

    <section class="total" aria-live="polite">
      <div class="line">
        <span>Сумма</span>
        <span id="subtotal">0 ₸</span>
      </div>
      <div class="line" id="line-discount" hidden>
        <span>Скидка</span>
        <span id="discount-amount">0 ₸</span>
      </div>
      <div class="line" id="line-after" hidden>
        <span>Сумма со скидкой</span>
        <span id="after-discount">0 ₸</span>
      </div>
      <div class="line" id="line-vat" hidden>
        <span>НДС</span>
        <span id="vat-amount">0 ₸</span>
      </div>
      <div class="line line-total">
        <span class="total-label">Итого к оплате</span>
        <strong class="total-value" id="total">0 ₸</strong>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
