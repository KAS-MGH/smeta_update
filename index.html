<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Смета за 5 минут</h1>
      <p class="hint">Заполните реквизиты и позиции — сумма считается сама.</p>
    </header>

    <section class="card" aria-labelledby="details-title">
      <h2 id="details-title">Реквизиты</h2>
      <div class="details">
        <div class="field">
          <label for="from">От кого</label>
          <input id="from" type="text" autocomplete="organization">
        </div>
        <div class="field">
          <label for="to">Для кого</label>
          <input id="to" type="text">
        </div>
        <div class="field">
          <label for="number">Номер сметы</label>
          <input id="number" type="text">
        </div>
        <div class="field">
          <label for="date">Дата</label>
          <input id="date" type="date">
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="items-title">
      <h2 id="items-title">Позиции</h2>
      <table class="items">
        <thead>
          <tr>
            <th scope="col">Наименование</th>
            <th scope="col">Количество</th>
            <th scope="col">Единица</th>
            <th scope="col">Цена, ₸</th>
            <th scope="col">Сумма</th>
            <th scope="col"><span class="visually-hidden">Удалить</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <button type="button" id="add" class="btn btn-secondary">+ Добавить позицию</button>
    </section>

    <section class="total" aria-live="polite">
      <span class="total-label">Итого к оплате</span>
      <strong class="total-value" id="total">0 ₸</strong>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
